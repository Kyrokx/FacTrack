{% extends "base.html" %}

{% block title %}Connexion - FacTrack{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[70vh] max-w-md items-center">
    <div class="w-full rounded-3xl bg-white p-6 shadow-soft ring-1 ring-slate-200 sm:p-8">
        <div class="mb-8 text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-primary text-xl font-bold text-white shadow-soft">F</div>
            <h1 class="text-3xl font-bold tracking-tight text-primary">Creation</h1>
            <p class="mt-2 text-sm text-textSecondary">Créer votre foyer.</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="id_name" class="mb-2 block text-sm font-semibold text-primary">Nom du foyer/maison/famille</label>
                {{ form.name }}
                {% if form.name.errors %}
                    <p class="mt-2 text-sm text-danger">{{ form.username.errors|striptags }}</p>
                {% endif %}
            </div>

            <button type="submit" class="w-full rounded-xl bg-primary px-5 py-3 text-sm font-semibold text-white transition duration-200 hover:-translate-y-0.5 hover:bg-secondary hover:shadow-soft">
                Creer mon foyer
            </button>
            <a href="{% url 'setup' %}"
                class="block text-center text-sm text-textSecondary hover:text-primary transition">
                ← Retour
            </a>
        </form>
{% endblock %}
