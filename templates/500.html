{% extends 'base.html' %}

{% block title %}Erreur serveur - FacTrack{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[60vh] max-w-3xl items-center justify-center px-4 py-8">
    <div class="w-full rounded-3xl bg-white p-8 text-center shadow-soft ring-1 ring-slate-200 sm:p-10">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-danger/10 text-danger">
            <i data-lucide="server-crash" class="h-8 w-8"></i>
        </div>
        <h1 class="mt-6 text-3xl font-bold tracking-tight text-primary sm:text-4xl">Erreur serveur</h1>
        <p class="mt-4 text-base leading-7 text-textSecondary">
            Une erreur interne s'est produite. Veuillez réessayer plus tard.
        </p>
        <div class="mt-8">
            <a href="{% url 'home' %}" class="inline-flex items-center justify-center rounded-xl bg-primary px-6 py-3 text-sm font-semibold text-white transition hover:bg-secondary hover:shadow-soft">
                Retour au tableau de bord
            </a>
        </div>
    </div>
</div>
{% endblock %}
